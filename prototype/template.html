<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTV OS — CampusTV 2026/27</title>

<style>
/* ==========================================================================
   CTV OS — Studio Essential
   --------------------------------------------------------------------------
   The visual system is Google Stitch's "Studio Essential", downloaded to
   stitch/design-system.json and ported by hand. Stitch's own export pulls in
   the Tailwind CDN, Google Fonts and Material Symbols; all three are blocked
   by the artifact CSP and by opening this file over file://, so the CSS below
   is written from the token set directly, Inter is embedded as a subsetted
   variable woff2, and every Material Symbol is redrawn as an inline SVG.

   Light only, by design. Studio Essential defines no dark palette, so there is
   no theme switch — offering one would mean inventing a second set of colours
   the design system has nothing to say about.
   ========================================================================== */

@font-face {
  font-family: 'Inter';
  /* Variable, wght 100–900: one face covers the 400/500/600/700 the system
     asks for, at a quarter the bytes of four static cuts. */
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
  src: url(data:font/woff2;base64,__FONT_INTER__) format('woff2');
}

:root {
  /* --- Studio Essential named colours, verbatim ------------------------- */
  --bg:              #faf8ff;   /* background / surface / surface-bright     */
  --card:            #ffffff;   /* surface-container-lowest                  */
  --low:             #f2f3ff;   /* surface-container-low  — the sidebar      */
  --container:       #eaedff;   /* surface-container                         */
  --high:            #e2e7ff;   /* surface-container-high                    */
  --highest:         #dae2fd;   /* surface-container-highest / surface-variant */
  --dim:             #d2d9f4;   /* surface-dim                               */

  --primary:         #004421;
  --primary-c:       #1d5c35;   /* primary-container                         */
  --on-primary:      #ffffff;
  --on-primary-c:    #92d2a1;
  --tint:            #2c6a42;   /* surface-tint                              */

  --on-surface:      #131b2e;
  --on-surface-var:  #404941;
  --secondary:       #5c5f61;
  --outline:         #707970;
  --outline-var:     #c0c9be;

  --error:           #ba1a1a;
  --error-c:         #ffdad6;   /* error-container                           */
  --on-error-c:      #93000a;
  --tertiary:        #2b3b50;

  /* Stitch's own calendar CSS steps outside the token set for the grid rules
     and uses slate-200. Kept, because a warm outline-variant grid over white
     cells reads green at 1px, and the month grid is mostly rules. */
  --grid:            #e2e8f0;
  --grid-bg:         #f8fafc;

  /* --- Shape and depth -------------------------------------------------- */
  /* roundness: ROUND_EIGHT. Cards take 12px (Stitch's rounded-xl), controls 8. */
  --r:               8px;
  --r-card:          12px;
  --r-pill:          999px;
  --shadow-sm:       0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow:          0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg:       0 12px 24px rgba(0, 0, 0, 0.08);

  /* --- Spacing scale --------------------------------------------------- */
  --gutter:          24px;
  --margin:          32px;
  --side-w:          260px;
  --top-h:           64px;

  /* --- Stacking ---------------------------------------------------------
     Declared in one place and used by name. An earlier build declared this
     scale in the design doc but never defined the custom properties, so
     `z-index: var(--z-toast)` resolved to `auto`, the toast sat under the
     scrim and Undo could not be clicked. Every layer below is defined. */
  --z-top:           40;
  --z-side-scrim:    45;
  --z-side:          50;
  --z-scrim:         60;
  --z-sheet:         70;
  --z-toast:         80;   /* above the sheet: undo must never be unreachable */

  --dur:             160ms;
  --ease:            cubic-bezier(0.2, 0, 0, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--on-surface);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;             /* body-md */
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
ul { margin: 0; padding: 0; list-style: none; }

/* --- Type scale, from designSystem.theme.typography --------------------- */
.t-display  { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.t-headline { font-size: 32px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
.t-title    { font-size: 24px; font-weight: 600; line-height: 1.25; }
.t-subtitle { font-size: 20px; font-weight: 500; line-height: 1.3; }
.t-label {
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase;
}
.t-body-lg  { font-size: 16px; font-weight: 400; }
.muted      { color: var(--on-surface-var); }
.dimmed     { color: var(--secondary); }
/* Tabular figures everywhere a number sits above or beside another number —
   dates, counts, times, countdowns. */
.num        { font-variant-numeric: tabular-nums; }

.icon { width: 20px; height: 20px; flex: none; display: block; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 24px; height: 24px; }

/* ==========================================================================
   Shell
   ========================================================================== */
.app { display: flex; min-height: 100vh; }

.side {
  position: fixed; inset: 0 auto 0 0; z-index: var(--z-side);
  width: var(--side-w);
  background: var(--low);
  border-right: 1px solid var(--high);
  display: flex; flex-direction: column;
}
.side-head { padding: 22px var(--gutter); border-bottom: 1px solid var(--high); }
.side-head h1 { font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: -0.01em; }
.side-head p { margin-top: 2px; color: var(--secondary); }
.side-cta { padding: 16px; }
.side-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.side-foot { border-top: 1px solid var(--high); padding: 12px 16px; display: grid; gap: 2px; }

.nav-item {
  display: flex; align-items: center; gap: 16px; width: 100%;
  padding: 12px var(--gutter); border: 0; background: none; text-align: left;
  color: var(--secondary); font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase;
  border-left: 3px solid transparent;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.nav-item:hover { background: var(--container); color: var(--on-surface); }
.nav-item[aria-current='true'] {
  color: var(--primary); font-weight: 700;
  background: var(--high); border-left-color: var(--primary);
}
/* The open-role count rides the nav item it belongs to, so the one number the
   product exists to drive down is visible from every screen. */
.nav-pill {
  margin-left: auto; min-width: 22px; padding: 1px 6px; border-radius: var(--r-pill);
  background: var(--error-c); color: var(--on-error-c);
  font-size: 11px; font-weight: 700; letter-spacing: 0; text-align: center;
}
.nav-pill.is-clear { background: var(--container); color: var(--on-surface-var); }
/* Assigning someone moves this number while you are looking at the sheet, not
   at the sidebar. The flash is how you know the count you just changed is the
   count that changed. */
.nav-pill.is-hit { animation: pill-hit 520ms var(--ease); }
@keyframes pill-hit {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.28); box-shadow: 0 0 0 4px rgba(0, 68, 33, 0.16); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 68, 33, 0); }
}

.side-link {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px; border: 0; background: none; border-radius: var(--r);
  color: var(--secondary); font-size: 13px; text-align: left;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.side-link:hover { background: var(--container); color: var(--on-surface); }

.main { flex: 1; min-width: 0; margin-left: var(--side-w); display: flex; flex-direction: column; }

.top {
  position: sticky; top: 0; z-index: var(--z-top);
  height: var(--top-h); flex: none;
  display: flex; align-items: center; gap: 16px;
  padding: 0 var(--gutter);
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--outline-var);
}
.search { position: relative; flex: 1; max-width: 420px; }
.search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--secondary); }
/* Fields take --outline, not --outline-var.
   A text field is empty until you type, so its border is the only thing saying
   a field is there — WCAG 1.4.11 puts that boundary at 3:1. Stitch's export
   uses outline-variant here, which measures 1.70:1 on white; --outline is the
   same design system's token for boundaries that have to be seen (4.51:1).
   Cards and grid rules keep outline-variant, because they are separators, not
   affordances. scripts/contrast.mjs holds the line. */
.search input {
  width: 100%; padding: 9px 12px 9px 40px;
  background: var(--low); border: 1px solid var(--outline);
  border-radius: var(--r); outline: 0;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.search input::placeholder { color: var(--secondary); }
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 68, 33, 0.2); background: var(--card); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.icon-btn {
  display: grid; place-items: center; width: 36px; height: 36px;
  border: 0; background: none; border-radius: var(--r-pill); color: var(--secondary);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--container); color: var(--on-surface); }
/* Both of these are phone-only and switch on in the responsive block below.
   They must be declared *here*, above it: an identical-specificity rule placed
   after a media query wins regardless of the query, which is how the menu
   button ended up invisible on the one device that needs it. */
.menu-btn { display: none; }
.side-scrim { display: none; }
.avatar {
  display: grid; place-items: center; flex: none;
  width: 32px; height: 32px; border-radius: var(--r-pill);
  background: var(--primary-c); color: var(--on-primary-c);
  font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
  border: 1px solid var(--outline-var);
}
/* Nobody has uploaded a photograph and the page makes no network requests, so
   every face in this product is a pair of initials. */
.avatar.sm { width: 26px; height: 26px; font-size: 10px; }
.avatar.lg { width: 52px; height: 52px; font-size: 16px; border-width: 2px; border-color: var(--high); }

.canvas { flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding: var(--margin) var(--gutter) 64px; }
.view[hidden] { display: none; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: var(--gutter); }
.page-head p { margin-top: 4px; color: var(--on-surface-var); max-width: 68ch; }
.page-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ==========================================================================
   Primitives
   ========================================================================== */
.card {
  background: var(--card); border: 1px solid var(--outline-var);
  border-radius: var(--r-card); box-shadow: var(--shadow);
}
.card-head {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid var(--outline-var);
}
.card-body { padding: 20px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: var(--r); border: 1px solid transparent;
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--primary-c); }
.btn-ghost { background: var(--card); color: var(--on-surface-var); border-color: var(--outline-var); }
.btn-ghost:hover { background: var(--low); color: var(--on-surface); }
.btn-danger { background: none; color: var(--error); border-color: var(--error-c); }
.btn-danger:hover { background: var(--error-c); color: var(--on-error-c); }
.btn-block { width: 100%; }

.seg {
  display: inline-flex; padding: 4px; gap: 2px;
  background: var(--container); border: 1px solid var(--outline-var);
  border-radius: var(--r); box-shadow: var(--shadow-sm);
}
.seg button {
  padding: 6px 16px; border: 0; background: none; border-radius: 6px;
  color: var(--secondary); font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg button:hover { color: var(--on-surface); }
.seg button[aria-pressed='true'] { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: var(--r-pill);
  background: var(--card); border: 1px solid var(--outline-var);
  color: var(--secondary); font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
  white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.chip:hover { background: var(--low); color: var(--on-surface); }
.chip[aria-pressed='true'] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip[aria-pressed='true'] .dot { background: currentColor; }
.chip .dot { width: 8px; height: 8px; border-radius: var(--r-pill); flex: none; }
.dot-error { background: var(--error); }
.dot-primary { background: var(--primary); }
.dot-secondary { background: var(--secondary); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }

/* A tag is a label, not a control: no hover, no pointer. */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  background: var(--highest); color: var(--on-surface-var); white-space: nowrap;
}
.tag-error { background: var(--error-c); color: var(--on-error-c); }
.tag-primary { background: var(--primary-c); color: var(--on-primary-c); }
.tag-outline { background: var(--card); color: var(--on-surface-var); border: 1px solid var(--outline-var); }

.stack { display: flex; flex-direction: column; gap: var(--gutter); }
.spacer { flex: 1; }
.empty {
  padding: 32px 20px; text-align: center; color: var(--secondary);
  background: var(--low); border: 1px dashed var(--outline-var); border-radius: var(--r-card);
}

/* ==========================================================================
   Overview
   ========================================================================== */
/* PRODUCT.md: the uncovered role "must be impossible to miss and impossible to
   confuse with anything else." Four equal metric tiles did the opposite — they
   gave a count of events and a count of unconfirmed dates the same weight as
   the one number the product exists to drive to zero. One readout carries it;
   everything else is a line of context underneath. */
.lede { display: flex; align-items: baseline; gap: 18px; padding: 22px 24px 20px; }
.lede-n {
  flex: none; font-size: 56px; font-weight: 700; letter-spacing: -0.03em;
  line-height: 0.9; color: var(--error); font-variant-numeric: tabular-nums;
}
.lede.is-clear .lede-n { color: var(--primary); }
.lede h3 { font-size: 20px; font-weight: 600; text-wrap: balance; }
.lede p { margin-top: 5px; color: var(--on-surface-var); max-width: 54ch; text-wrap: pretty; }

.meta-strip {
  display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap;
  margin-bottom: var(--gutter); color: var(--secondary);
}
.meta-strip > * + *::before {
  content: ''; display: inline-block; width: 3px; height: 3px; border-radius: 50%;
  background: var(--outline); vertical-align: 0.24em; margin-right: 14px;
}
.meta-item { border: 0; background: none; padding: 0; color: inherit; font: inherit; }
.meta-item b { font-weight: 600; color: var(--on-surface); font-variant-numeric: tabular-nums; }
button.meta-item { text-decoration: underline; text-decoration-color: var(--outline-var); text-underline-offset: 3px; }
button.meta-item:hover { color: var(--on-surface); text-decoration-color: currentColor; }
button.meta-item.is-alert b { color: var(--error); }

.dash { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gutter); align-items: start; }

/* The uncovered role is the primary object, so on the overview it gets the
   slot Stitch gave the live video player — the largest thing on the screen. */
.gap-row {
  display: flex; align-items: flex-start; gap: 16px; width: 100%;
  padding: 14px 20px; border: 0; border-top: 1px solid var(--outline-var);
  background: none; text-align: left;
  transition: background var(--dur) var(--ease);
}
.gap-row:hover { background: var(--low); }
.gap-when {
  flex: none; width: 76px; padding-top: 2px;
  color: var(--secondary); font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase;
}
.gap-main { flex: 1; min-width: 0; }
.gap-title { font-weight: 600; }
.gap-roles { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.gap-n { flex: none; align-self: center; }

.next-count { padding: 16px; border-radius: var(--r); background: var(--container); }
.next-count .t-label { color: var(--primary); }
.next-days { margin-top: 4px; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.next-days small { font-size: 16px; font-weight: 500; letter-spacing: 0; color: var(--on-surface-var); margin-left: 6px; }
.faces { display: flex; }
.faces > * { margin-left: -8px; border: 2px solid var(--card); }
.faces > *:first-child { margin-left: 0; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick button {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 8px; border-radius: var(--r);
  background: var(--bg); border: 1px solid var(--outline-var); color: var(--on-surface-var);
  font-size: 12px; font-weight: 600;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.quick button:hover { border-color: var(--primary); background: var(--low); color: var(--primary); }

/* ==========================================================================
   Calendar — the month grid
   --------------------------------------------------------------------------
   Stitch's Event Schedule is a week strip only. The month grid was explicitly
   required, so it is drawn here in Studio Essential's language: a white card,
   a 1px slate grid, and event badges that take their colour from whether the
   event still has a job nobody is doing.
   ========================================================================== */
.month-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.month-nav {
  display: flex; align-items: center; gap: 4px; padding: 4px;
  background: var(--card); border: 1px solid var(--outline-var);
  border-radius: var(--r); box-shadow: var(--shadow-sm);
}
.month-nav h2 { min-width: 168px; text-align: center; font-size: 20px; font-weight: 600; }
.month-nav .sep { width: 1px; height: 24px; background: var(--outline-var); margin: 0 4px; }
.month-nav .link {
  padding: 6px 14px; border: 0; background: none; border-radius: 6px;
  color: var(--primary); font-size: 13px; font-weight: 600;
}
.month-nav .link:hover { background: var(--container); }
.month-nav .icon-btn { width: 32px; height: 32px; border-radius: 6px; }

/* The year ribbon: eleven months of the academic year, each carrying its own
   count of open roles. Asked for alongside the month grid, and redrawn here as
   date cards rather than the tally ticks of the rejected direction. */
.ribbon { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: thin; }
.rib {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
  width: 66px; padding: 8px 4px; border-radius: var(--r);
  background: var(--card); border: 1px solid var(--outline-var); color: var(--on-surface);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.rib:hover { border-color: var(--primary); }
.rib-m { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--secondary); }
.rib-n { font-size: 18px; font-weight: 700; }
.rib-bar { width: 26px; height: 3px; border-radius: var(--r-pill); background: var(--highest); }
.rib-bar.is-open { background: var(--error); }
.rib-bar.is-clear { background: var(--primary); }
.rib.is-current { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.rib.is-current .rib-m { color: rgba(255, 255, 255, 0.85); }
.rib.is-current .rib-bar { background: rgba(255, 255, 255, 0.5); }
.rib.is-now .rib-m::after { content: '•'; margin-left: 3px; color: var(--primary); }
.rib.is-current.is-now .rib-m::after { color: var(--on-primary); }

.cal { overflow: hidden; }
.weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: var(--low); border-bottom: 1px solid var(--outline-var);
}
.weekdays span {
  padding: 12px 0; text-align: center;
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--secondary);
}
.grid {
  /* minmax(0, …), not 1fr. A bare 1fr floors at min-content, and the event
     badges are `white-space: nowrap`, so one long title dragged the whole
     column wider and the seven days stopped being the same size. */
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
  background: var(--grid); gap: 1px; border-top: 1px solid var(--grid);
}
.day {
  position: relative; min-height: 124px; padding: 8px;
  background: var(--card); transition: background var(--dur) var(--ease);
}
.day:hover { background: #f1f5f9; }
.day.is-outside { background: var(--grid-bg); }
.day.is-outside .daynum { color: #94a3b8; }
.day.is-today { background: var(--low); }
.day.is-today .daynum { color: var(--primary); font-weight: 700; }
.day.is-drop { background: var(--container); box-shadow: inset 0 0 0 2px var(--primary); }
.day-head { display: flex; align-items: center; justify-content: space-between; min-height: 20px; }
.daynum { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.today-dot { width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--primary); }

/* The badge is the miniature of the event card: same colour logic, one line. */
.ev {
  display: block; width: 100%; margin-top: 4px; padding: 3px 7px;
  border: 0; border-radius: 4px; text-align: left;
  font-size: 11px; font-weight: 500; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: var(--container); color: var(--primary);
  transition: filter var(--dur) var(--ease);
}
.ev:hover { filter: brightness(0.96); }
.ev.is-open { background: var(--error-c); color: var(--on-error-c); }
/* An event with no roles on it at all is not a crewed event. Without this it
   took the default green badge and read as complete — a fabricated finished
   state, which is worse than an honest empty one. */
.ev.is-bare { background: var(--highest); color: var(--on-surface-var); }
.ev.is-cancelled { background: var(--highest); color: var(--secondary); text-decoration: line-through; }
.ev.is-dragging { opacity: 0.4; }
.ev.is-faded { opacity: 0.28; }
.ev-time { font-variant-numeric: tabular-nums; opacity: 0.75; }

.day-add {
  position: absolute; right: 5px; bottom: 5px;
  width: 22px; height: 22px; display: grid; place-items: center;
  border: 1px solid var(--outline-var); border-radius: 6px;
  background: var(--card); color: var(--secondary);
  opacity: 0; transition: opacity var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.day:hover .day-add { opacity: 1; }
.day-add:hover, .day-add:focus-visible { opacity: 1; border-color: var(--primary); color: var(--primary); }

/* ==========================================================================
   Schedule — week strip and timeline
   ========================================================================== */
.weekstrip { display: flex; align-items: center; gap: 12px; margin-bottom: var(--gutter); flex-wrap: wrap; }
.weekstrip .days { display: flex; gap: 8px; }
.dcard {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  width: 62px; height: 78px; border-radius: var(--r-card);
  background: var(--card); border: 1px solid var(--outline-var); color: var(--on-surface);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.dcard:hover { border-color: var(--primary); }
.dcard-d { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--secondary); }
.dcard-n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dcard-dot { width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--error); margin-top: 2px; }
/* A day with nothing on it recedes by colour, not by opacity: opacity fades
   the text along with the card, and at 0.55 the date dropped to 3.86:1. */
.dcard.is-empty { background: var(--bg); }
.dcard.is-empty .dcard-n { color: var(--secondary); font-weight: 600; }
.dcard.is-sel { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-sm); }
.dcard.is-sel .dcard-d { color: rgba(255, 255, 255, 0.9); }
.dcard.is-sel .dcard-dot { background: var(--on-primary); }
.round-btn {
  display: grid; place-items: center; width: 40px; height: 40px; flex: none;
  border-radius: var(--r-pill); background: var(--card);
  border: 1px solid var(--outline-var); color: var(--on-surface-var);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.round-btn:hover { background: var(--low); border-color: var(--primary); }

.timeline { position: relative; display: flex; flex-direction: column; gap: var(--gutter); }
/* The rail sits under the nodes, behind the cards, aligned to the node centre. */
.timeline::before {
  content: ''; position: absolute; top: 12px; bottom: 12px; left: 146px;
  width: 2px; background: var(--outline-var); opacity: 0.5;
}
.tl-month {
  display: flex; align-items: center; gap: 12px;
  margin-top: 8px; color: var(--secondary);
}
.tl-month::after { content: ''; flex: 1; height: 1px; background: var(--outline-var); }
.tl-row { display: flex; align-items: flex-start; gap: 20px; position: relative; }
.tl-when { flex: none; width: 118px; padding-top: 14px; text-align: right; }
.tl-day { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-time { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--secondary); font-variant-numeric: tabular-nums; }
/* The node on the rail is the state marker, and it is the only one.
   The card used to carry a 4px coloured left edge as well — a side-stripe
   accent, which is decoration standing in for information. It said nothing the
   node, the strand tag, the crewed fraction and the Missing Requirements panel
   were not already saying, and it sat where nobody scans. The node is on the
   rail the eye is already following. */
.tl-node { flex: none; width: 18px; margin-top: 19px; display: grid; place-items: center; }
.tl-node i {
  width: 13px; height: 13px; border-radius: var(--r-pill);
  background: var(--primary); border: 3px solid var(--bg);
  box-shadow: 0 0 0 1.5px var(--primary);
  transition: box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.tl-row.is-open .tl-node i { background: var(--error); box-shadow: 0 0 0 1.5px var(--error); }
.tl-row.is-bare .tl-node i,
.tl-row.is-cancelled .tl-node i { background: var(--card); box-shadow: 0 0 0 1.5px var(--outline); }
.tl-row:hover .tl-node i { transform: scale(1.18); }
.tl-card { flex: 1; min-width: 0; padding: 18px 20px; text-align: left; width: 100%; }
.tl-card:hover { box-shadow: var(--shadow-lg); }
.tl-top { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.tl-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.tl-place { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--secondary); }
.tl-brief { margin-top: 6px; color: var(--on-surface-var); max-width: 62ch; }
.tl-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--outline-var); }

/* Missing Requirements, straight from Stitch — and the single most important
   component in the product, because an uncovered role is the thing CTV OS
   exists to surface. Assign is inside it, so closing the gap never means
   navigating somewhere else first. */
.missing {
  flex: none; width: 272px; padding: 12px 14px; border-radius: var(--r);
  background: var(--error-c); border: 1px solid var(--error-c);
}
.missing-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--on-error-c); }
.missing-h span { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
.missing li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 0; }
.missing li span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--on-error-c); }
.assign {
  border: 0; background: none; padding: 2px 4px; border-radius: 4px;
  color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
}
.assign:hover { background: rgba(255, 255, 255, 0.6); text-decoration: underline; }

/* ==========================================================================
   Tasks
   ========================================================================== */
/* Columns are not boxes. A tinted, bordered column holding bordered white
   cards is a card inside a card; the column only needs to say where it starts
   and how much is in it, which a heading rule does. */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(208px, 1fr); gap: 18px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.col { display: flex; flex-direction: column; min-width: 0; }
.col-h {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 10px; margin-bottom: 12px;
  border-bottom: 2px solid var(--outline-var);
  color: var(--on-surface-var);
}
.col-n { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: var(--r-pill); background: var(--container); color: var(--on-surface-var); font-size: 11px; font-weight: 700; text-align: center; }
.col.is-over .col-h { color: var(--on-error-c); border-bottom-color: var(--error); }
.col.is-over .col-n { background: var(--error-c); color: var(--on-error-c); }
.col-body { display: flex; flex-direction: column; gap: 10px; }
/* Empty states teach what the column is for rather than reporting a void. */
.col-empty { font-size: 13px; color: var(--secondary); padding: 2px 2px 8px; text-wrap: pretty; }

/* Adding a to-do happens in place, above the board, in the same shape as the
   event sheet: fields apply on change, nothing is behind a wizard. */
.addbar {
  display: grid; grid-template-columns: minmax(220px, 3fr) minmax(130px, 1fr) minmax(150px, 1fr) auto auto;
  gap: 12px; align-items: end;
  padding: 16px 18px; margin-bottom: var(--gutter);
  background: var(--card); border: 1px solid var(--primary);
  border-radius: var(--r-card); box-shadow: var(--shadow);
}
.addbar label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--secondary); }
.addbar input, .addbar select {
  width: 100%; margin-top: 5px; padding: 9px 11px;
  border: 1px solid var(--outline); border-radius: var(--r); background: var(--card); outline: 0;
  font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--on-surface);
}
.addbar input:focus, .addbar select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 68, 33, 0.2); }

.tcard { padding: 12px 14px; border-radius: var(--r); position: relative; }
.tcard-x {
  position: absolute; top: 8px; right: 8px;
  display: grid; place-items: center; width: 24px; height: 24px;
  border: 0; background: none; border-radius: 4px; color: var(--secondary);
  opacity: 0; transition: opacity var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.tcard:hover .tcard-x, .tcard-x:focus-visible { opacity: 1; }
.tcard-x:hover { background: var(--error-c); color: var(--on-error-c); }
.tcard-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-right: 26px; }
.tcard-t { font-weight: 600; line-height: 1.35; }
.tcard-d { margin-top: 4px; color: var(--secondary); font-size: 13px; }
.tcard-f { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--secondary); font-size: 12px; flex-wrap: wrap; }
.tcard-due { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.tcard.is-over .tcard-due { color: var(--error); font-weight: 600; }
.tcard.is-done { opacity: 0.55; }
.tcard.is-done .tcard-t { text-decoration: line-through; }

/* A checkbox that keeps the platform control but takes the accent colour —
   the box is the only place in the product where a tick means "done". */
.box {
  flex: none; width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--primary); cursor: pointer;
}

.tbl-wrap { border-radius: var(--r-card); border: 1px solid var(--outline-var); overflow: hidden; background: var(--card); box-shadow: var(--shadow); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  padding: 14px 20px; text-align: left; background: var(--high);
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--secondary); white-space: nowrap;
}
.tbl td { padding: 13px 20px; border-top: 1px solid var(--high); vertical-align: middle; }
.tbl tbody tr { transition: background var(--dur) var(--ease); }
.tbl tbody tr:hover { background: var(--low); }
.tbl .td-t { font-weight: 500; }
.tbl tr.is-done .td-t { text-decoration: line-through; color: var(--secondary); }
.tbl .td-due { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.is-over .td-due { color: var(--error); font-weight: 600; }
.rel { display: block; font-size: 11px; color: var(--secondary); font-weight: 400; }

/* ==========================================================================
   Crew
   ========================================================================== */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--gutter); }
/* No accent bar across the top. It was decoration duplicating the Clash tag,
   and on the seven cards that do not clash it said nothing at all. */
.person { padding: 20px; display: flex; flex-direction: column; }
.person.is-clash { border-color: var(--error); box-shadow: 0 0 0 1px var(--error), var(--shadow); }
.person-h { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.person-h h3 { font-size: 18px; font-weight: 600; }
.person-role { color: var(--primary); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; margin-top: 1px; }
.person-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 16px; border-top: 1px solid var(--outline-var); }
.kv-k { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--secondary); margin-bottom: 5px; }
.kv-v { font-size: 13px; }
.next-list { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--outline-var); display: grid; gap: 2px; }
.next-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; margin: 0 -8px;
  border: 0; background: none; border-radius: 6px; text-align: left; font-size: 13px;
  transition: background var(--dur) var(--ease);
}
.next-item:hover { background: var(--low); }
.next-item .d { flex: none; width: 52px; color: var(--secondary); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.next-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ==========================================================================
   Sheet, scrim, toast
   ========================================================================== */
.scrim {
  position: fixed; inset: 0; z-index: var(--z-scrim);
  border: 0; padding: 0; background: rgba(19, 27, 46, 0.32);
  opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease);
}
.scrim.is-open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; z-index: var(--z-sheet); top: 0; right: 0; bottom: 0;
  width: min(520px, 100vw);
  background: var(--card); border-left: 1px solid var(--outline-var);
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.1);
  transform: translateX(100%); transition: transform 220ms var(--ease);
  overflow-y: auto; overscroll-behavior: contain;
}
.sheet.is-open { transform: none; }
.sheet-in { padding: 20px var(--gutter) 96px; }
.sheet-head {
  position: sticky; top: 0; z-index: 1; margin: -20px calc(var(--gutter) * -1) 16px;
  padding: 18px var(--gutter); background: var(--card);
  border-bottom: 1px solid var(--outline-var);
  display: flex; align-items: flex-start; gap: 12px;
}
.sheet-head h2 { font-size: 20px; font-weight: 600; }
.sheet-when { margin-top: 3px; color: var(--secondary); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
.rule {
  display: flex; align-items: center; gap: 10px;
  margin: 22px 0 12px; color: var(--secondary);
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
}
.rule::after { content: ''; flex: 1; height: 1px; background: var(--outline-var); }

.field { display: block; margin-bottom: 12px; }
.field-k { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--secondary); }
.field input, .field select, .sheet textarea {
  width: 100%; padding: 9px 11px; border-radius: var(--r);
  background: var(--card); border: 1px solid var(--outline); outline: 0;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.field input:focus, .field select:focus, .sheet textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 68, 33, 0.2);
}
.sheet textarea { min-height: 116px; resize: vertical; font-family: inherit; }
/* 100px, not 132: the four time fields are one thought, and at 132 the sheet
   fitted three and left "Out" stranded on a line of its own. */
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }

/* One bay per role. The select IS the bay — closing a crew gap is the product's
   whole job, so it must never require opening a second thing to do it. */
.bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; align-items: start; }
.bay { padding: 10px 12px 8px; border-radius: var(--r); background: var(--low); border: 1px solid var(--outline-var); }
.bay.is-open { background: var(--error-c); border-color: var(--error-c); }
.bay.is-editing { background: var(--card); border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.bay-h { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
/* The role name edits in place. It looks like the label it is until you focus
   it, so a bank of six roles does not read as a bank of six text fields. */
.bay-k {
  flex: 1; min-width: 0; width: 100%;
  padding: 2px 4px; margin: -2px -4px;
  border: 1px solid transparent; border-radius: 4px; background: none; outline: 0;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--secondary);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.bay-k:hover { border-color: var(--outline-var); }
.bay-k:focus { border-color: var(--primary); background: var(--card); color: var(--on-surface); }
.bay.is-open .bay-k { color: var(--on-error-c); }
.bay-x {
  flex: none; display: grid; place-items: center; width: 22px; height: 22px;
  border: 0; background: none; border-radius: 4px; color: var(--secondary);
  opacity: 0; transition: opacity var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.bay:hover .bay-x, .bay-x:focus-visible { opacity: 1; }
.bay-x:hover { background: var(--error-c); color: var(--on-error-c); }
.bay select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--outline); background: var(--card); outline: 0; }
.bay select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 68, 33, 0.2); }
.bay-t { margin-top: 6px; font-size: 11px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.bay-clash { color: var(--error); font-weight: 600; }
/* Times and on-site are set once and read often, so they collapse to a line
   you can click. Assigning somebody is the frequent act; it stays one control. */
.bay-toggle {
  display: flex; align-items: center; gap: 4px; width: 100%;
  padding: 4px 4px; margin: 2px -4px -2px;
  border: 0; background: none; border-radius: 4px; text-align: left;
  font-size: 11px; color: var(--secondary); font-variant-numeric: tabular-nums;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.bay-toggle:hover { background: var(--container); color: var(--on-surface); }
.bay.is-open .bay-toggle:hover { background: rgba(255, 255, 255, 0.55); }
.bay-toggle .icon { margin-left: auto; transition: transform var(--dur) var(--ease); }
.bay-toggle[aria-expanded='true'] .icon { transform: rotate(180deg); }
.bay-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.bay-edit label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--secondary); }
.bay-edit input[type='time'] { width: 100%; margin-top: 3px; padding: 5px 6px; border: 1px solid var(--outline); border-radius: 6px; background: var(--card); outline: 0; font-size: 12px; }
.bay-edit input[type='time']:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 68, 33, 0.2); }
.bay-edit label.bay-check {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 7px;
  text-transform: none; letter-spacing: 0;
  font-size: 12px; font-weight: 500; color: var(--on-surface-var);
}
.bay-check input { accent-color: var(--primary); width: 16px; height: 16px; flex: none; }
.bank-add { margin-top: 10px; }

.rows { display: grid; gap: 1px; background: var(--outline-var); border: 1px solid var(--outline-var); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; background: var(--card); }
.row-l { flex: 1; min-width: 0; }
.row-sub { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--primary); }
.row-d { display: block; margin-top: 3px; font-size: 12px; color: var(--secondary); }
.row-due { flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.row-date { display: block; font-size: 12px; font-weight: 600; }
.row-rel { display: block; font-size: 11px; color: var(--secondary); }
.row-due.is-over .row-date, .row-due.is-over .row-rel { color: var(--error); }

.note { padding: 11px 13px; border-radius: var(--r); background: var(--low); border: 1px solid var(--outline-var); margin-bottom: 8px; font-size: 13px; }
.note.is-caution { background: var(--error-c); border-color: var(--error-c); color: var(--on-error-c); }
.note-k { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--secondary); margin-bottom: 3px; }
.note.is-caution .note-k { color: var(--on-error-c); }

.sheet-foot {
  position: sticky; bottom: 0; margin: 24px calc(var(--gutter) * -1) -96px;
  padding: 14px var(--gutter); background: var(--card);
  border-top: 1px solid var(--outline-var);
  display: flex; align-items: center; gap: 10px;
}

/* Every mutation is undoable, which is the only reason offering Delete on a
   year of unconfirmed dates is safe rather than reckless. */
.toast {
  position: fixed; z-index: var(--z-toast); left: 50%; bottom: 24px;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  max-width: calc(100vw - 32px);
  padding: 10px 12px 10px 18px; border-radius: var(--r);
  background: var(--on-surface); color: #fff; box-shadow: var(--shadow-lg);
  font-size: 13px;
  animation: toast-in 220ms var(--ease);
}
@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 12px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}
.toast[hidden] { display: none; }
.toast button {
  padding: 5px 12px; border-radius: 6px;
  background: none; border: 1px solid rgba(255, 255, 255, 0.5); color: #fff;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
}
.toast button:hover { background: #fff; color: var(--on-surface); }

:where(button, a, input, select, textarea):focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}

/* ==========================================================================
   Narrow
   --------------------------------------------------------------------------
   The month grid survives on a phone, because the month grid is the thing that
   was asked for. Cells drop the badge text and keep a coloured bar, which is
   the glanceable part; tapping the day opens it.
   ========================================================================== */
@media (max-width: 1100px) {
  .dash { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  :root { --margin: 20px; --gutter: 16px; }
  .side { transform: translateX(-100%); transition: transform 220ms var(--ease); }
  .side.is-open { transform: none; }
  .main { margin-left: 0; }
  .menu-btn { display: grid; }

  /* The sidebar had no way out. It slid over the page with nothing behind it,
     so tapping the content you could still see did nothing and the only exit
     was Escape — which a phone does not have. */
  .side-scrim {
    display: block; position: fixed; inset: 0; z-index: var(--z-side-scrim);
    border: 0; padding: 0; background: rgba(19, 27, 46, 0.32);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur) var(--ease);
  }
  .side-scrim.is-open { opacity: 1; pointer-events: auto; }

  /* 44px targets. This is the mode PRODUCT.md is tuned for: one hand, dark
     venue, kit in the other. */
  .icon-btn { width: 44px; height: 44px; }
  .round-btn { width: 44px; height: 44px; }
  .side-link { padding: 12px 8px; }
  .assign { padding: 10px 8px; margin: -6px -8px -6px 0; }
  .chip { padding: 10px 16px; }
  .seg button { padding: 10px 16px; }
  .box { width: 22px; height: 22px; }
  .timeline::before { display: none; }
  .tl-row { flex-direction: column; gap: 8px; }
  .tl-when { width: auto; padding-top: 0; text-align: left; display: flex; align-items: baseline; gap: 8px; }
  .tl-node { display: none; }
  .missing { width: 100%; }
  .day { min-height: 74px; padding: 5px 4px; }
  .ev { font-size: 0; padding: 0; height: 5px; margin-top: 3px; border-radius: 3px; }
  .ev-time { display: none; }
  .day-add { display: none; }
  .weekdays span { font-size: 10px; }
  .sheet { width: 100%; }
  .stats { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; }
  .sheet { transition: none; }
}
