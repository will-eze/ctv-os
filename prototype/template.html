<script>
const SEED = __DATA__;
const TODAY = '2026-08-07';   // the prototype's "now"
// Bumped when the stored shape changes — v1 predates tasks, and a stale v1
// blob would leave DATA.tasks undefined on the one screen that needs it.
const STORE = 'ctvos.year.v2';

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3   = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
// Monday-first. Stitch's grid runs Sunday-first, which is a US convention; a
// UK academic week starts on Monday and the weekend belongs together at the end.
const DAYS   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const byId = (list) => Object.fromEntries(list.map((x) => [x.id, x]));
const MEMBERS = byId(SEED.members);
const SOCS = byId(SEED.societies);

// --- Store ----------------------------------------------------------------
// Not one date in this year is confirmed. The handover states National
// Television Day and the rule that welcome weekend is the Friday–Sunday before
// freshers; everything else was inferred, so the working copy is the truth and
// the seed is only a starting point you can fall back to.
const clone = (x) => JSON.parse(JSON.stringify(x));

let DATA = (() => {
  try {
    const saved = localStorage.getItem(STORE);
    if (saved) return JSON.parse(saved);
  } catch { /* corrupt or unavailable storage falls back to the seed */ }
  return clone(SEED);
})();

const persist = () => {
  try { localStorage.setItem(STORE, JSON.stringify(DATA)); } catch { /* private mode */ }
};

// Every mutation goes through here, so every mutation is undoable. That is
// what makes offering Delete safe rather than reckless.
function mutate(label, fn) {
  const before = clone(DATA);
  fn(DATA);
  persist();
  render();
  toast(label, () => { DATA = before; persist(); render(); });
}

let toastTimer;
function toast(text, undo) {
  const el = document.getElementById('toast');
  document.getElementById('toast-t').textContent = text;
  const btn = document.getElementById('toast-undo');
  btn.onclick = () => { undo(); el.hidden = true; clearTimeout(toastTimer); };
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 7000);
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const d2 = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${d2(d.getMonth() + 1)}-${d2(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const svg = (name, cls) => `<svg class="icon ${cls || 'icon-sm'}"><use href="#i-${name}"/></svg>`;
const initials = (m) => (m?.known_as ?? '?').slice(0, 2).toUpperCase();
const relDay = (n) => n === null ? '' : n < 0 ? `${Math.abs(n)}d late` : n === 0 ? 'today' : `in ${n}d`;
const shortDate = (s) => `${d2(parse(s).getDate())} ${MON3[parse(s).getMonth()]}`;

// --- Derived state --------------------------------------------------------
// Coverage and clashes are computed, never stored — same rule as the SQL views,
// so the prototype cannot drift from what the database would say.
function coverage(ev) {
  const roles = ev.roles || [];
  const open = roles.filter((r) => !r.member).length;
  return { total: roles.length, open, filled: roles.length - open,
           complete: roles.length > 0 && open === 0 };
}

// One person, two on-site jobs, overlapping hours. Off-site roles (the editor,
// whose work is tomorrow at a desk) are excluded — see schema.sql.
//
// Recomputed on every render rather than cached: moving an event onto a day
// where someone is already booked has to surface the clash immediately, which
// is most of the point of being able to move events at all.
function findClashes() {
  const out = new Map();
  const onSite = (r) => r.on_site !== false;
  const mins = (t) => t ? Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5)) : null;
  const byDate = {};
  for (const ev of DATA.events) (byDate[ev.date] ||= []).push(ev);

  for (const list of Object.values(byDate)) {
    const slots = [];
    for (const ev of list) {
      if (ev.status === 'cancelled') continue;
      for (const r of ev.roles || []) {
        if (r.member && onSite(r)) slots.push({ ev, r });
      }
    }
    for (let i = 0; i < slots.length; i++) {
      for (let j = i + 1; j < slots.length; j++) {
        const a = slots[i], b = slots[j];
        if (a.r.member !== b.r.member) continue;
        const af = mins(a.r.from) ?? 0, at = mins(a.r.to) ?? 1439;
        const bf = mins(b.r.from) ?? 0, bt = mins(b.r.to) ?? 1439;
        if (af < bt && bf < at) {
          out.set(a.r, `${b.r.label} on ${b.ev.title}`);
          out.set(b.r, `${a.r.label} on ${a.ev.title}`);
        }
      }
    }
  }
  return out;
}

let CLASHES = new Map();
const totalOpen = () => DATA.events.reduce((n, ev) => n + coverage(ev).open, 0);

// --- Who can actually do this job ----------------------------------------
// CTV OS exists to stop crew gaps, so an assignment control that will silently
// create a clash — or put somebody on a camera they have never been signed off
// on — is working against the product. The dropdown answers both questions
// before you choose, instead of the clash detector complaining afterwards.
const ROLE_SKILL = {
  camera: 'camera', vision_mix: 'vision_mix', ptz: 'ptz',
  editor: 'edit', audio: 'audio',
};
// Producing and interviewing need no sign-off, so they are absent by design.

// New roles are typed as free text, so the skill a label implies is inferred
// once, here, rather than asking for a role key nobody thinks in.
const LABEL_ROLE = {
  'CAM OP': 'camera', 'BACK CAM': 'camera', 'CAMERA': 'camera', 'GANTRY': 'camera',
  'SU BOX': 'camera', 'ROAMING': 'camera', 'ASSIST': 'camera',
  'INTERVIEW': 'interview', 'VISION MIX': 'vision_mix', 'PTZ': 'ptz',
  'EDITOR': 'editor', 'POST': 'editor', 'POSTING': 'editor',
  'AUDIO': 'audio', 'SOUND': 'audio',
  'PRODUCER': 'producer', 'LEAD': 'producer', 'CHAIR': 'producer',
};
const ROLE_PRESETS = ['CAM OP', 'INTERVIEW', 'VISION MIX', 'PTZ', 'AUDIO', 'EDITOR',
  'PRODUCER', 'LEAD', 'GANTRY', 'SU BOX', 'ROAMING', 'BACK CAM', 'STALL', 'TECH', 'ASSIST'];

const roleMins = (t) => t ? Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5)) : null;

// Everything else this person is already holding, on this date, at these hours.
// Same rule as the clash detector: off-site work is not a conflict of presence.
function busyWith(memberId, ev, role) {
  if (!memberId) return [];
  const af = roleMins(role.from) ?? 0, at = roleMins(role.to) ?? 1439;
  const out = [];
  for (const other of DATA.events) {
    if (other.date !== ev.date || other.status === 'cancelled') continue;
    for (const r of other.roles || []) {
      if (r === role || r.member !== memberId) continue;
      if (r.on_site === false || role.on_site === false) continue;
      const bf = roleMins(r.from) ?? 0, bt = roleMins(r.to) ?? 1439;
      if (af < bt && bf < at) out.push(`${r.label} on ${other.title}`);
    }
  }
  return out;
}

function peopleOptions(ev, role) {
  const need = ROLE_SKILL[role.role];
  const free = [], busy = [], untrained = [];
  for (const m of SEED.members) {
    const sel = m.id === role.member ? ' selected' : '';
    const trained = !need || (m.trained || []).includes(need);
    const clashes = busyWith(m.id, ev, role);
    if (!trained) {
      untrained.push(`<option value="${m.id}"${sel}>${esc(m.known_as)}</option>`);
    } else if (clashes.length) {
      busy.push(`<option value="${m.id}"${sel}>${esc(`${m.known_as} — ${clashes[0]}`)}</option>`);
    } else {
      free.push(`<option value="${m.id}"${sel}>${esc(m.known_as)}</option>`);
    }
  }
  const group = (label, opts) => opts.length ? `<optgroup label="${esc(label)}">${opts.join('')}</optgroup>` : '';
  return group(need ? 'Free, and signed off' : 'Free', free)
       + group('Already on something else', busy)
       + group(need ? `Not signed off on ${need.replace(/_/g, ' ')}` : 'Unavailable', untrained);
}

// --- Search ---------------------------------------------------------------
// One box, filtering whatever screen you are on. On the calendar it fades the
// events that do not match rather than removing them, because a month with
// holes punched in it stops being a month.
let q = '';
const hit = (...parts) => !q || parts.filter(Boolean).join(' ').toLowerCase().includes(q);
const evHit = (e) => hit(e.title, e.venue, e.strand, e.brief,
  (e.roles || []).map((r) => `${r.label} ${MEMBERS[r.member]?.known_as ?? ''}`).join(' '));

// --- Overview -------------------------------------------------------------
function renderOverview() {
  const evs = [...DATA.events].sort((a, b) => a.date.localeCompare(b.date));
  const open = totalOpen();
  const gaps = evs.filter((e) => coverage(e).open > 0 && e.status !== 'cancelled');
  const tasks = withDue(DATA.tasks || []);
  const overdue = tasks.filter((t) => !t.done && t.left !== null && t.left < 0).length;
  const soft = evs.filter((e) => e.confidence !== 'fixed').length;
  const upcoming = evs.filter((e) => e.date >= TODAY);
  const next = upcoming[0];

  const clashPeople = new Set();
  for (const ev of DATA.events) {
    for (const r of ev.roles || []) if (CLASHES.has(r) && r.member) clashPeople.add(r.member);
  }

  // One sentence of context under the number, built from the data rather than
  // padded out — "across 21 events, nearest in 35 days" is the shape of the
  // problem; a second metric tile is not.
  const nearest = gaps[0];
  const lede = open
    ? `<p>Across ${gaps.length} event${gaps.length === 1 ? '' : 's'}.
        ${nearest ? `The nearest is <b>${esc(nearest.title)}</b>, ${relDay(daysBetween(TODAY, nearest.date))}.` : ''}</p>`
    : '<p>Every role on every event has a name against it. That is the whole job.</p>';

  const meta = (label, n, opts = {}) => {
    const body = `<b>${n}</b> ${label}`;
    return opts.view
      ? `<button class="meta-item${opts.alert ? ' is-alert' : ''}" data-view="${opts.view}" type="button">${body}</button>`
      : `<span class="meta-item">${body}</span>`;
  };

  const gapRows = gaps.slice(0, 7).map((e) => {
    const cov = coverage(e);
    const left = daysBetween(TODAY, e.date);
    return `<button class="gap-row" data-ev="${e.id}" type="button">
      <span class="gap-when num">${shortDate(e.date)}<br><span class="dimmed">${relDay(left)}</span></span>
      <span class="gap-main">
        <span class="gap-title">${esc(e.title)}</span>
        <span class="gap-roles">${(e.roles || []).filter((r) => !r.member)
          .map((r) => `<span class="tag tag-error">${esc(r.label)}</span>`).join('')}</span>
      </span>
      <span class="gap-n tag ${cov.open ? 'tag-error' : ''} num">${cov.filled}/${cov.total}</span>
    </button>`;
  }).join('');

  document.getElementById('v-overview').innerHTML = `
    <div class="page-head">
      <div>
        <h2 class="t-headline">Studio Overview</h2>
        <p>The state of the year, and what still has nobody on it.</p>
      </div>
    </div>

    <div class="meta-strip">
      ${meta(`event${evs.length === 1 ? '' : 's'}, ${upcoming.length} still ahead`, evs.length, { view: 'schedule' })}
      ${meta('dates still to confirm', soft, { view: 'calendar' })}
      ${clashPeople.size ? meta(`${clashPeople.size === 1 ? 'person' : 'people'} double-booked`, clashPeople.size, { view: 'crew', alert: true }) : ''}
      ${overdue
        ? meta('to-dos overdue', overdue, { view: 'tasks', alert: true })
        : meta('to-dos open', tasks.filter((t) => !t.done).length, { view: 'tasks' })}
    </div>

    <div class="dash">
      <div class="card">
        <div class="lede${open ? '' : ' is-clear'}">
          <span class="lede-n">${open}</span>
          <div>
            <h3>${open === 1 ? 'role still has' : 'roles still have'} nobody on ${open === 1 ? 'it' : 'them'}</h3>
            ${lede}
          </div>
        </div>
        ${gapRows || '<div class="card-body" style="border-top:1px solid var(--outline-var)"><p class="empty">Nothing to close. Add an event and its roles will show up here.</p></div>'}
        ${gaps.length > 7 ? `<div class="card-body" style="border-top:1px solid var(--outline-var)">
          <button class="btn btn-ghost btn-block" data-view="schedule" type="button">See all ${gaps.length} in the schedule</button>
        </div>` : ''}
      </div>

      <div class="stack">
        <div class="card card-body">
          <h3 class="t-subtitle" style="display:flex;align-items:center;gap:8px">${svg('calendar', 'icon')} Next up</h3>
          ${next ? (() => {
            const cov = coverage(next);
            const left = daysBetween(TODAY, next.date);
            return `<div class="next-count" style="margin-top:14px">
              <span class="t-label">${left === 0 ? 'Happening' : 'Starts in'}</span>
              <div class="next-days num">${left === 0 ? 'Today' : left}${left === 0 ? '' : '<small>days</small>'}</div>
            </div>
            <h4 class="t-body-lg" style="margin-top:14px;font-weight:600">${esc(next.title)}</h4>
            <p class="dimmed" style="display:flex;align-items:center;gap:5px;margin-top:4px">
              ${svg('pin')} ${esc(next.venue ?? 'venue to confirm')}</p>
            <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--outline-var)">
              <p class="t-label dimmed" style="margin-bottom:8px">Crew ${cov.filled}/${cov.total}</p>
              <div class="faces">
                ${(next.roles || []).filter((r) => r.member).map((r) =>
                  `<span class="avatar sm" title="${esc(MEMBERS[r.member]?.known_as ?? '')} — ${esc(r.label)}">${initials(MEMBERS[r.member])}</span>`).join('')}
                ${cov.open ? `<span class="avatar sm" style="background:var(--error-c);color:var(--on-error-c)" title="${cov.open} open">+${cov.open}</span>` : ''}
              </div>
            </div>
            <button class="btn btn-ghost btn-block" style="margin-top:16px" data-ev="${next.id}" type="button">Open event</button>`;
          })() : '<p class="empty" style="margin-top:14px">Nothing left in the year.</p>'}
        </div>

        <div class="card card-body">
          <h3 class="t-subtitle" style="margin-bottom:14px">Quick actions</h3>
          <div class="quick">
            <button data-add="${TODAY}" type="button">${svg('plus', 'icon')} Add event</button>
            <button data-view="calendar" type="button">${svg('calendar', 'icon')} Month grid</button>
            <button data-view="tasks" type="button">${svg('checklist', 'icon')} To do</button>
            <button data-view="crew" type="button">${svg('group', 'icon')} Crew</button>
          </div>
        </div>
      </div>
    </div>`;
}

// --- Calendar: year ribbon ------------------------------------------------
// Eleven months, August to June. Each carries the count of roles nobody is on
// in that month, so the shape of the year's trouble is visible before you
// choose which month to look at.
function renderRibbon() {
  const months = [];
  for (let m = 7; m <= 17; m++) months.push({ y: 2026 + Math.floor(m / 12), m: m % 12 });
  const now = parse(TODAY);
  return `<div class="ribbon" id="ribbon">${months.map(({ y, m }) => {
    const evs = DATA.events.filter((e) => {
      const d = parse(e.date); return d.getFullYear() === y && d.getMonth() === m;
    });
    const openN = evs.reduce((n, e) => n + coverage(e).open, 0);
    const isNow = y === now.getFullYear() && m === now.getMonth();
    const isCur = y === cur.y && m === cur.m;
    return `<button class="rib${isCur ? ' is-current' : ''}${isNow ? ' is-now' : ''}"
              data-y="${y}" data-m="${m}" type="button"
              title="${MONTHS[m]} ${y} — ${evs.length} event${evs.length === 1 ? '' : 's'}${openN ? `, ${openN} open` : ''}">
      <span class="rib-m">${MON3[m]}</span>
      <span class="rib-n num">${evs.length || '·'}</span>
      <span class="rib-bar ${openN ? 'is-open' : evs.length ? 'is-clear' : ''}"></span>
    </button>`;
  }).join('')}</div>`;
}

// --- Calendar: the month grid ---------------------------------------------
// Open on the month you are actually in. If that month is empty — most of
// August, before term — fall forward to the next month that has something in
// it, so the first thing you see is never a blank grid.
let cur = (() => {
  const t = parse(TODAY);
  const here = SEED.events.some((e) => {
    const d = parse(e.date);
    return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth();
  });
  if (here) return { y: t.getFullYear(), m: t.getMonth() };
  const next = [...SEED.events].sort((a, b) => a.date.localeCompare(b.date))
    .find((e) => e.date >= TODAY);
  const d = next ? parse(next.date) : t;
  return { y: d.getFullYear(), m: d.getMonth() };
})();
let calFilter = 'all';

function renderCalendar() {
  const first = new Date(cur.y, cur.m, 1);
  const lead = (first.getDay() + 6) % 7;               // Monday-first
  const start = new Date(cur.y, cur.m, 1 - lead);

  const pass = (e) => calFilter === 'all'
    || (calFilter === 'open' && coverage(e).open > 0)
    || (calFilter === 'soft' && e.confidence !== 'fixed');

  // Whole weeks only. Six rows are laid out and a trailing week that lies
  // entirely outside the month is dropped — but the test has to be per week,
  // not per day: breaking mid-row leaves the grid's own background showing
  // through the cells that were never emitted.
  let cells = '';
  for (let w = 0; w < 6; w++) {
    const week = Array.from({ length: 7 }, (_, d) =>
      new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d));
    if (week.every((day) => day.getMonth() !== cur.m)) continue;
    for (const day of week) {
    const key = iso(day);
    const outside = day.getMonth() !== cur.m;
    const evs = DATA.events.filter((e) => e.date === key && pass(e));
    cells += `<div class="day${outside ? ' is-outside' : ''}${key === TODAY ? ' is-today' : ''}" data-day="${key}">
      <div class="day-head">
        <span class="daynum">${day.getDate()}</span>
        ${key === TODAY ? '<i class="today-dot"></i>' : ''}
      </div>
      ${evs.map((e) => {
        const cov = coverage(e);
        const cls = e.status === 'cancelled' ? 'is-cancelled'
          : cov.open ? 'is-open' : cov.total ? '' : 'is-bare';
        const t = e.start_time || e.call_time;
        return `<button class="ev ${cls}${evHit(e) ? '' : ' is-faded'}" data-ev="${e.id}"
                  draggable="true" type="button"
                  title="${esc(e.title)} — ${cov.total ? `${cov.filled}/${cov.total} crewed` : 'no roles yet'}">
          ${t ? `<span class="ev-time num">${t}</span> ` : ''}${esc(e.title)}
        </button>`;
      }).join('')}
      <button class="day-add" data-add="${key}" type="button" aria-label="Add an event on ${key}">
        ${svg('plus')}
      </button>
    </div>`;
    }
  }

  const fchip = (id, label, dot) =>
    `<button class="chip" data-cal-filter="${id}" aria-pressed="${calFilter === id}" type="button">
      ${dot ? `<i class="dot ${dot}"></i>` : ''}${label}</button>`;

  document.getElementById('v-calendar').innerHTML = `
    <div class="page-head">
      <div>
        <h2 class="t-headline">Broadcast Calendar</h2>
        <p>Drag an event to move it. Nothing in this year is confirmed until you say so.</p>
      </div>
      <div class="page-tools">
        ${fchip('all', 'All')}
        ${fchip('open', 'Needs crew', 'dot-error')}
        ${fchip('soft', 'Date to confirm', 'dot-secondary')}
      </div>
    </div>

    <div class="month-bar">
      <div class="month-nav">
        <button class="icon-btn" id="prev" type="button" aria-label="Previous month">${svg('left')}</button>
        <h2 class="num" id="month-title">${MONTHS[cur.m]} ${cur.y}</h2>
        <button class="icon-btn" id="next" type="button" aria-label="Next month">${svg('right')}</button>
        <span class="sep"></span>
        <button class="link" id="today" type="button">Today</button>
      </div>
    </div>

    ${renderRibbon()}

    <div class="card cal">
      <div class="weekdays">${DAYS.map((d) => `<span>${d}</span>`).join('')}</div>
      <div class="grid" id="weeks">${cells}</div>
    </div>`;
}

// --- Schedule -------------------------------------------------------------
// Stitch's Event Schedule, with the production list kept as its second mode.
// A station runs about thirty events a year, so most weeks are empty and a
// week-only view would be a wall of empty states.
let schedMode = 'all';
let selDay = TODAY;

function renderSchedule() {
  const sel = parse(selDay);
  const weekStart = new Date(sel.getFullYear(), sel.getMonth(), sel.getDate() - ((sel.getDay() + 6) % 7));
  const week = Array.from({ length: 7 }, (_, i) =>
    new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i));

  const strip = week.map((d) => {
    const key = iso(d);
    const n = DATA.events.filter((e) => e.date === key).length;
    return `<button class="dcard${key === selDay ? ' is-sel' : ''}${n ? '' : ' is-empty'}"
              data-sel-day="${key}" type="button">
      <span class="dcard-d">${DAYS[(d.getDay() + 6) % 7]}</span>
      <span class="dcard-n">${d.getDate()}</span>
      ${n ? '<i class="dcard-dot"></i>' : ''}
    </button>`;
  }).join('');

  const inWeek = (e) => e.date >= iso(week[0]) && e.date <= iso(week[6]);
  const evs = [...DATA.events]
    .filter((e) => (schedMode === 'week' ? inWeek(e) : true) && evHit(e))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.start_time ?? '').localeCompare(b.start_time ?? ''));

  let body = '', lastMonth = '';
  for (const e of evs) {
    const d = parse(e.date);
    const cov = coverage(e);
    const openRoles = (e.roles || []).map((r, i) => ({ r, i })).filter((x) => !x.r.member);
    const mk = `${d.getFullYear()}-${d.getMonth()}`;
    if (schedMode === 'all' && mk !== lastMonth) {
      lastMonth = mk;
      const mOpen = evs.filter((x) => { const xd = parse(x.date);
        return `${xd.getFullYear()}-${xd.getMonth()}` === mk; })
        .reduce((n, x) => n + coverage(x).open, 0);
      body += `<div class="tl-month">
        <span class="t-label">${MONTHS[d.getMonth()]} ${d.getFullYear()}</span>
        <span class="tag ${mOpen ? 'tag-error' : ''} num">${mOpen ? `${mOpen} open` : 'crewed'}</span>
      </div>`;
    }
    const state = e.status === 'cancelled' ? 'is-cancelled'
      : cov.open ? 'is-open' : cov.total ? '' : 'is-bare';
    body += `<div class="tl-row ${state}">
      <div class="tl-when">
        <span class="tl-day num">${d2(d.getDate())} ${MON3[d.getMonth()]}</span>
        <span class="tl-time">${DAYS[(d.getDay() + 6) % 7].toUpperCase()}${
          e.start_time ? ` · ${e.start_time}` : ''}</span>
      </div>
      <div class="tl-node"><i></i></div>
      <div class="card tl-card">
        <div class="tl-top">
          <div style="flex:1;min-width:220px">
            <div class="tl-meta">
              <span class="tag ${e.status === 'cancelled' ? '' : cov.open ? 'tag-error' : 'tag-primary'}">${esc(e.strand)}</span>
              ${e.venue ? `<span class="tl-place">${svg('pin')} ${esc(e.venue)}</span>` : ''}
              ${e.confidence !== 'fixed' ? '<span class="tag tag-outline">Date to confirm</span>' : ''}
              ${e.status === 'idea' ? '<span class="tag tag-outline">Idea</span>' : ''}
            </div>
            <h3 class="t-title" style="font-size:20px">${esc(e.title)}</h3>
            ${e.brief ? `<p class="tl-brief">${esc(e.brief)}</p>` : ''}
          </div>
          ${openRoles.length ? `<div class="missing">
            <div class="missing-h">${svg('warning')}<span>Missing Requirements</span></div>
            <ul>${openRoles.map(({ r, i }) => `<li>
              <span>${svg('person')} ${esc(r.label)}</span>
              <button class="assign" data-assign="${e.id}:${i}" type="button">Assign</button>
            </li>`).join('')}</ul>
          </div>` : ''}
        </div>
        <div class="tl-foot">
          <div class="faces">${(e.roles || []).filter((r) => r.member).map((r) =>
            `<span class="avatar sm${CLASHES.has(r) ? '' : ''}" title="${esc(MEMBERS[r.member]?.known_as ?? '')} — ${esc(r.label)}${
              CLASHES.has(r) ? ` (clash: ${esc(CLASHES.get(r))})` : ''}">${initials(MEMBERS[r.member])}</span>`).join('')
            || '<span class="dimmed" style="font-size:12px">no roles yet</span>'}</div>
          <span class="tag ${cov.open ? 'tag-error' : cov.total ? '' : 'tag-outline'} num">${
            cov.total ? `${cov.filled}/${cov.total} crewed` : 'no roles yet'}</span>
          ${(e.roles || []).some((r) => CLASHES.has(r))
            ? `<span class="tag tag-error">${svg('warning')} Clash</span>` : ''}
          <span class="spacer"></span>
          <button class="btn btn-ghost" data-ev="${e.id}" type="button">Open</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('v-schedule').innerHTML = `
    <div class="page-head">
      <div>
        <h2 class="t-headline">Event Schedule</h2>
        <p>Every broadcast and what it still needs before it can happen.</p>
      </div>
      <div class="page-tools">
        <div class="seg" role="group" aria-label="Range">
          <button data-sched="week" aria-pressed="${schedMode === 'week'}" type="button">This week</button>
          <button data-sched="all" aria-pressed="${schedMode === 'all'}" type="button">All</button>
        </div>
      </div>
    </div>

    <div class="weekstrip">
      <button class="round-btn" data-week="-7" type="button" aria-label="Previous week">${svg('left')}</button>
      <div class="days">${strip}</div>
      <button class="round-btn" data-week="7" type="button" aria-label="Next week">${svg('right')}</button>
      <button class="btn btn-ghost" data-sel-day="${TODAY}" type="button">${svg('calendar')} Today</button>
    </div>

    <div class="timeline">${body || `<p class="empty">${
      schedMode === 'week' ? 'Nothing on in this week. The strip above moves you around; “All” shows the whole year.'
                           : 'No events match that search.'}</p>`}</div>`;
}

// --- To do ----------------------------------------------------------------
// Everything actionable in the handover that is not tied to one event date.
// Per-event work stays on the event as prep; this is the rest of the job.
const AREAS = {
  setup: 'Setup', training: 'Training', money: 'Money',
  socials: 'Socials', team: 'Team', nasta: 'NaSTA', legacy: 'Legacy',
};
let areaFilter = 'all';
let hideDone = false;
let taskMode = 'board';
let addingTask = false;

// A task anchored to an event is due `lead_days` before it, so it moves when
// the event moves. Given not one date this year is confirmed, that is the only
// way the list stays true after you start correcting the calendar.
function taskDue(t) {
  if (t.due) return t.due;
  if (!t.anchor) return null;
  const ev = DATA.events.find((e) => e.id === t.anchor);
  if (!ev) return null;                       // anchor deleted: no date, not a wrong one
  const d = parse(ev.date);
  return iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - (t.lead_days ?? 0)));
}

const withDue = (list) => list.map((t) => {
  const due = taskDue(t);
  return { ...t, due_on: due, left: due === null ? null : daysBetween(TODAY, due) };
});

const BUCKETS = [
  ['Overdue',       (n) => n !== null && n < 0,            true],
  ['Next 7 days',   (n) => n !== null && n >= 0 && n <= 7, false],
  ['Next 30 days',  (n) => n !== null && n > 7 && n <= 30, false],
  ['Later',         (n) => n !== null && n > 30,           false],
  ['No date yet',   (n) => n === null,                     false],
];

// An empty column should say what the column is for. "Nothing here" is a
// report on the absence of data; these say what it means that it is empty.
const EMPTY_COL = {
  'Overdue':      'Nothing late. This is the column to keep empty.',
  'Next 7 days':  'Clear week. Anything dated in the next seven days lands here.',
  'Next 30 days': 'Nothing due this month.',
  'Later':        'Nothing parked further out.',
  'No date yet':  'Everything has a date, either its own or one inherited from an event.',
};

function renderTasks() {
  const tasks = withDue(DATA.tasks || []);
  const done = tasks.filter((t) => t.done).length;
  const shown = tasks.filter((t) =>
    (areaFilter === 'all' || t.area === areaFilter)
    && !(hideDone && t.done)
    && hit(t.title, t.detail, t.owner_role, AREAS[t.area]));

  const chips = ['all', ...Object.keys(AREAS)].map((a) => {
    const n = tasks.filter((t) => a === 'all' || t.area === a).length;
    const openN = tasks.filter((t) => (a === 'all' || t.area === a) && !t.done).length;
    return `<button class="chip" data-area="${a}" aria-pressed="${areaFilter === a}" type="button">${
      a === 'all' ? 'All' : AREAS[a]} <span class="num">${openN}/${n}</span></button>`;
  }).join('');

  const anchorNote = (t) => t.anchor
    ? `${t.lead_days}d before ${DATA.events.find((e) => e.id === t.anchor)?.title ?? '—'}`
    : '';

  const groups = BUCKETS.map(([label, test, isOver]) => [
    label, isOver,
    shown.filter((t) => test(t.left))
      .sort((a, b) => (a.due_on ?? '9999').localeCompare(b.due_on ?? '9999')),
  ]);

  const board = `<div class="board">${groups.map(([label, isOver, group]) => `
    <div class="col${isOver && group.some((t) => !t.done) ? ' is-over' : ''}">
      <div class="col-h">
        <span class="t-label">${label}</span>
        <span class="col-n num">${group.filter((t) => !t.done).length}</span>
      </div>
      <div class="col-body">${group.length ? group.map((t) => `
        <div class="card tcard${t.done ? ' is-done' : ''}${!t.done && t.left !== null && t.left < 0 ? ' is-over' : ''}">
          <div class="tcard-h">
            <span class="tag ${t.done ? '' : t.left !== null && t.left < 0 ? 'tag-error' : ''}">${AREAS[t.area]}</span>
            <span class="spacer"></span>
            <input class="box" type="checkbox" data-task="${t.id}" ${t.done ? 'checked' : ''}
                   aria-label="${esc(t.title)}">
          </div>
          <button class="tcard-x" data-task-del="${t.id}" type="button"
                  aria-label="Delete: ${esc(t.title)}">${svg('trash')}</button>
          <div class="tcard-t">${esc(t.title)}</div>
          ${t.detail ? `<div class="tcard-d">${esc(t.detail)}</div>` : ''}
          <div class="tcard-f">
            ${t.due_on ? `<span class="tcard-due">${svg('clock')} ${shortDate(t.due_on)} · ${relDay(t.left)}</span>` : ''}
            <span class="spacer"></span>
            <span title="${t.source === 'you' ? 'Added by you' : `Handover ${esc(t.source)}`}">${esc(t.owner_role)}</span>
          </div>
          ${t.anchor ? `<div class="tcard-d" style="margin-top:6px">${esc(anchorNote(t))}</div>` : ''}
        </div>`).join('') : `<p class="col-empty">${EMPTY_COL[label]}</p>`}
      </div>
    </div>`).join('')}</div>`;

  const rows = groups.flatMap(([, , group]) => group).map((t) => `
    <tr class="${t.done ? 'is-done' : ''}${!t.done && t.left !== null && t.left < 0 ? ' is-over' : ''}">
      <td><input class="box" type="checkbox" data-task="${t.id}" ${t.done ? 'checked' : ''}
                 aria-label="${esc(t.title)}"></td>
      <td class="td-t">${esc(t.title)}
        ${t.detail ? `<span class="rel">${esc(t.detail)}</span>` : ''}</td>
      <td><span class="tag">${AREAS[t.area]}</span></td>
      <td class="td-due">${t.due_on ? `${shortDate(t.due_on)}<span class="rel">${relDay(t.left)}</span>` : '<span class="dimmed">—</span>'}</td>
      <td class="dimmed">${esc(t.owner_role)}<span class="rel">${
        t.source === 'you' ? 'Added by you' : `Handover ${esc(t.source)}`}</span></td>
      <td><span class="tag ${t.done ? 'tag-primary' : t.left !== null && t.left < 0 ? 'tag-error' : ''}">${
        t.done ? 'Done' : t.left !== null && t.left < 0 ? 'Overdue' : 'To do'}</span></td>
    </tr>`).join('');

  const list = `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th></th><th>Task</th><th>Area</th><th>Due</th><th>Owner</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;

  const addForm = addingTask ? `
    <form class="addbar" id="task-form">
      <label>To do
        <input name="title" required autocomplete="off" placeholder="What needs doing?"></label>
      <label>Area
        <select name="area">${Object.entries(AREAS).map(([k, v]) =>
          `<option value="${k}"${k === (areaFilter === 'all' ? 'setup' : areaFilter) ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>Due
        <input type="date" name="due" value=""></label>
      <button class="btn btn-primary" type="submit">Add</button>
      <button class="btn btn-ghost" type="button" id="task-cancel">Cancel</button>
    </form>` : '';

  document.getElementById('v-tasks').innerHTML = `
    <div class="page-head">
      <div>
        <h2 class="t-headline">To do</h2>
        <p>Everything the handover asks of a station manager, plus whatever else you add. ${done} of ${tasks.length} done.</p>
      </div>
      <div class="page-tools">
        <button class="chip" id="hide-done" aria-pressed="${hideDone}" type="button">Hide done</button>
        <div class="seg" role="group" aria-label="Layout">
          <button data-task-mode="board" aria-pressed="${taskMode === 'board'}" type="button">Board</button>
          <button data-task-mode="list" aria-pressed="${taskMode === 'list'}" type="button">List</button>
        </div>
        <button class="btn btn-primary" id="task-new" type="button">${svg('plus')} New to-do</button>
      </div>
    </div>
    <div class="chips" style="margin-bottom:var(--gutter)">${chips}</div>
    ${addForm}
    ${shown.length ? (taskMode === 'board' ? board : list)
      : `<p class="empty">Nothing here. Everything in ${
        areaFilter === 'all' ? 'the handover' : AREAS[areaFilter]} is either done or filtered out.</p>`}`;
}

// --- Crew -----------------------------------------------------------------
let skillFilter = 'all';

function renderCrew() {
  const skills = [...new Set(SEED.members.flatMap((m) => m.trained || []))].sort();
  const people = SEED.members.filter((m) =>
    (skillFilter === 'all' || (m.trained || []).includes(skillFilter))
    && hit(m.known_as, m.full_name, m.committee_role, (m.trained || []).join(' ')));

  const chips = ['all', ...skills].map((s) =>
    `<button class="chip" data-skill="${s}" aria-pressed="${skillFilter === s}" type="button">${
      s === 'all' ? 'All crew' : esc(s.replace(/_/g, ' '))}</button>`).join('');

  const cards = people.map((m) => {
    // Assignments are derived from the events, not stored on the person — the
    // same rule as everywhere else, so moving an event updates the directory.
    const mine = DATA.events
      .filter((e) => (e.roles || []).some((r) => r.member === m.id))
      .sort((a, b) => a.date.localeCompare(b.date));
    const ahead = mine.filter((e) => e.date >= TODAY);
    const clashes = mine.flatMap((e) => (e.roles || [])
      .filter((r) => r.member === m.id && CLASHES.has(r))
      .map((r) => ({ e, r, with: CLASHES.get(r) })));
    const next = ahead[0];

    return `<div class="card person${clashes.length ? ' is-clash' : ''}">
      <div class="person-h">
        <span class="avatar lg">${initials(m)}</span>
        <div style="flex:1;min-width:0">
          <h3>${esc(m.known_as)}</h3>
          <p class="person-role">${esc(m.committee_role ?? 'Crew')}</p>
        </div>
        ${clashes.length
          ? `<span class="tag tag-error">${svg('warning')} Clash</span>`
          : `<span class="tag">${ahead.length} ahead</span>`}
      </div>

      <div class="person-grid">
        <div>
          <span class="kv-k">Trained on</span>
          <span class="kv-v">${(m.trained || []).length
            ? (m.trained || []).map((t) => `<span class="tag" style="margin:0 4px 4px 0">${esc(t.replace(/_/g, ' '))}</span>`).join('')
            : '<span class="dimmed">nothing signed off</span>'}</span>
        </div>
        <div>
          <span class="kv-k">Roles this year</span>
          <span class="kv-v num" style="font-size:20px;font-weight:700">${
            DATA.events.reduce((n, e) => n + (e.roles || []).filter((r) => r.member === m.id).length, 0)}</span>
        </div>
      </div>

      ${clashes.length ? `<div class="note is-caution" style="margin-top:14px;margin-bottom:0">
        <span class="note-k">Double-booked</span>
        ${clashes.map((c) => `${esc(c.e.title)} — also ${esc(c.with)}`).join('<br>')}
      </div>` : ''}

      ${ahead.length ? `<div class="next-list">
        <span class="kv-k">Next up</span>
        ${ahead.slice(0, 3).map((e) => `<button class="next-item" data-ev="${e.id}" type="button">
          <span class="d num">${shortDate(e.date)}</span>
          <span class="t">${esc(e.title)}</span>
          <span class="dimmed" style="font-size:11px">${esc((e.roles || [])
            .filter((r) => r.member === m.id).map((r) => r.label).join(', '))}</span>
        </button>`).join('')}
      </div>` : `<div class="next-list"><span class="dimmed" style="font-size:12px">
        ${next ? '' : 'Nothing booked ahead.'}</span></div>`}
    </div>`;
  }).join('');

  document.getElementById('v-crew').innerHTML = `
    <div class="page-head">
      <div>
        <h2 class="t-headline">Crew Directory</h2>
        <p>Who can do what, and who is already committed. Names come from the handover — replace them before this ships.</p>
      </div>
    </div>
    <div class="chips" style="margin-bottom:var(--gutter)">${chips}</div>
    ${cards ? `<div class="people">${cards}</div>` : '<p class="empty">Nobody matches that.</p>'}`;
}

// --- Event sheet ----------------------------------------------------------
// Everything editable applies on change rather than behind a Save button: the
// sheet is where you correct a date you were never sure of, and a confirmation
// step between "I know the real date" and "the calendar knows it" earns
// nothing. Undo covers the mistakes.
// Which role bay has its times/on-site detail open. View state, not data — it
// deliberately survives a re-render of the sheet but nothing else.
let bayEdit = null;
// Which event the sheet is showing, so a mutation from anywhere — including an
// Undo pressed on the toast, which is outside the sheet — can refresh it.
let sheetId = null;

// Building the sheet and opening it are separate. Undo re-runs render(), which
// has to rebuild the sheet's contents; if that also moved focus, every undo
// would yank the caret to the close button.
function openSheet(id, refocus) {
  if (!renderSheet(id)) return;
  document.getElementById('sheet').classList.add('is-open');
  document.getElementById('sheet').setAttribute('aria-hidden', 'false');
  document.getElementById('scrim').classList.add('is-open');
  const sheetIn = document.getElementById('sheet-in');
  const back = refocus && sheetIn.querySelector(`[data-f="${refocus}"]`);
  (back || document.getElementById('sheet-x')).focus();
}

function renderSheet(id) {
  const e = DATA.events.find((x) => x.id === id);
  if (!e) return false;
  sheetId = id;
  const d = parse(e.date);
  const cov = coverage(e);
  const soc = e.society ? SOCS[e.society] : null;

  const STRANDS = ['freshers', 'sport', 'society', 'studio', 'ball', 'training', 'awards', 'admin', 'social'];
  const STATUSES = ['idea', 'planned', 'confirmed', 'wrapped', 'cancelled'];
  const opts = (list, sel) => list.map((v) =>
    `<option value="${v}"${v === sel ? ' selected' : ''}>${v[0].toUpperCase() + v.slice(1)}</option>`).join('');

  // Prep: the template lines that apply to this strand, plus the event's own.
  const tmpl = (DATA.prep_templates || []).filter(
    (t) => t.strand === '*' || t.strand === e.strand
  );
  const prep = [...tmpl, ...(e.prep || [])].map((p) => {
    const due = new Date(d.getFullYear(), d.getMonth(), d.getDate() - p.lead_days);
    const left = daysBetween(TODAY, iso(due));
    return { ...p, due, left };
  }).sort((a, b) => a.due - b.due);

  document.getElementById('sheet-in').innerHTML = `
    <div class="sheet-head">
      <div style="flex:1;min-width:0">
        <h2>${esc(e.title)}</h2>
        <p class="sheet-when num">${DAYS[(d.getDay() + 6) % 7].toUpperCase()} ${d2(d.getDate())} ${MON3[d.getMonth()]} ${d.getFullYear()}
          · ${e.confidence === 'estimated' ? 'date not confirmed' : 'date confirmed'}</p>
      </div>
      <button class="icon-btn" id="sheet-x" type="button" aria-label="Close">${svg('close', 'icon')}</button>
    </div>

    <label class="field">
      <span class="field-k">Title</span>
      <input type="text" data-f="title" value="${esc(e.title)}">
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field-k">Date</span>
        <input type="date" data-f="date" value="${e.date}">
      </label>
      <label class="field">
        <span class="field-k">Confidence</span>
        <select data-f="confidence">
          <option value="estimated"${e.confidence !== 'fixed' ? ' selected' : ''}>Not confirmed</option>
          <option value="fixed"${e.confidence === 'fixed' ? ' selected' : ''}>Confirmed</option>
        </select>
      </label>
    </div>

    <div class="field-row">
      <label class="field">
        <span class="field-k">Venue</span>
        <input type="text" data-f="venue" value="${esc(e.venue ?? '')}" placeholder="—">
      </label>
      <label class="field">
        <span class="field-k">Strand</span>
        <select data-f="strand">${opts(STRANDS, e.strand)}</select>
      </label>
      <label class="field">
        <span class="field-k">Status</span>
        <select data-f="status">${opts(STATUSES, e.status)}</select>
      </label>
    </div>

    <div class="rule">Times</div>
    <div class="field-row">
      <label class="field"><span class="field-k">Crew call</span>
        <input type="time" data-f="call_time" value="${e.call_time ?? ''}"></label>
      <label class="field"><span class="field-k">Doors</span>
        <input type="time" data-f="doors_time" value="${e.doors_time ?? ''}"></label>
      <label class="field"><span class="field-k">Start</span>
        <input type="time" data-f="start_time" value="${e.start_time ?? ''}"></label>
      <label class="field"><span class="field-k">Out</span>
        <input type="time" data-f="end_time" value="${e.end_time ?? ''}"></label>
    </div>

    <div class="rule">Brief</div>
    <textarea data-f="brief" placeholder="What are we actually making?">${esc(e.brief ?? '')}</textarea>

    <div class="rule">Crew
      <span class="tag ${cov.open ? 'tag-error' : cov.complete ? 'tag-primary' : ''} num">
        ${cov.filled}/${cov.total}${cov.open ? ` · ${cov.open} open` : ''}</span>
    </div>
    ${cov.total ? `<div class="bank">${e.roles.map((r, i) => {
      const clash = CLASHES.get(r);
      const editing = bayEdit === i;
      const when = r.on_site === false ? 'off site, no clash'
        : r.from ? `${r.from}–${r.to ?? '?'}` : 'no times — treated as all day';
      return `<div class="bay${r.member ? '' : ' is-open'}${editing ? ' is-editing' : ''}">
        <div class="bay-h">
          <input class="bay-k" data-role-label="${i}" value="${esc(r.label)}"
                 list="role-presets" aria-label="Name of role ${i + 1}" spellcheck="false">
          <button class="bay-x" data-role-del="${i}" type="button"
                  aria-label="Remove the ${esc(r.label)} role">${svg('close')}</button>
        </div>
        <select data-role="${i}" aria-label="Who is on ${esc(r.label)}">
          <option value=""${r.member ? '' : ' selected'}>Open — nobody yet</option>
          ${peopleOptions(e, r)}
        </select>
        <button class="bay-toggle" data-role-edit="${i}" type="button" aria-expanded="${editing}">
          ${when}${svg('chevron')}
        </button>
        ${editing ? `<div class="bay-edit">
          <label>From<input type="time" data-role-time="${i}:from" value="${r.from ?? ''}"></label>
          <label>To<input type="time" data-role-time="${i}:to" value="${r.to ?? ''}"></label>
          <label class="bay-check" title="Off-site work never counts as a clash — an editor's job happens tomorrow, at a desk.">
            <input type="checkbox" data-role-onsite="${i}" ${r.on_site === false ? '' : 'checked'}>
            On site
          </label>
        </div>` : ''}
        ${clash ? `<div class="bay-t bay-clash">Clash: ${esc(clash)}</div>` : ''}
      </div>`;
    }).join('')}</div>`
    : `<p class="empty">No roles on this event yet. Add the jobs that need doing and
        CTV OS can start telling you which of them nobody is on.</p>`}
    <datalist id="role-presets">${ROLE_PRESETS.map((v) => `<option value="${v}">`).join('')}</datalist>
    <button class="btn btn-ghost bank-add" id="role-add" type="button">
      ${svg('plus')} Add a role
    </button>

    ${prep.length ? `<div class="rule">Prep</div>
      <div class="rows">${prep.map((p) => {
        const over = p.left < 0;
        return `<div class="row">
          <span class="row-l">
            ${esc(p.label)}
            ${p.owner_role ? `<span class="row-sub">${esc(p.owner_role)}</span>` : ''}
            ${p.detail ? `<span class="row-d">${esc(p.detail)}</span>` : ''}
          </span>
          <span class="row-due num ${over ? 'is-over' : ''}">
            <span class="row-date">${d2(p.due.getDate())} ${MON3[p.due.getMonth()]}</span>
            <span class="row-rel">${relDay(p.left)}</span>
          </span>
        </div>`;
      }).join('')}</div>` : ''}

    ${soc ? `<div class="rule">${esc(soc.name)}</div>
      ${soc.standing_terms ? `<div class="note"><span class="note-k">Always</span>${esc(soc.standing_terms)}</div>` : ''}
      ${soc.cautions ? `<div class="note is-caution"><span class="note-k">Learned the hard way</span>${esc(soc.cautions)}</div>` : ''}
      ${soc.charge_policy ? `<div class="note"><span class="note-k">Money</span>${esc(soc.charge_policy)}</div>` : ''}
      ` : ''}

    ${(e.deliverables || []).length ? `<div class="rule">Out of it</div>
      <div class="rows">${e.deliverables.map((v) => `<div class="row">
        <span class="row-l">${esc(v.title)}
          ${v.nasta_category ? `<span class="row-sub">NaSTA · ${esc(v.nasta_category)}</span>` : ''}</span>
        <span class="row-due num"><span class="row-date">+${v.due_offset}d</span></span>
      </div>`).join('')}</div>` : ''}

    <div class="sheet-foot">
      <button class="btn btn-primary" id="sheet-done" type="button">Done</button>
      <span class="spacer"></span>
      <button class="btn btn-danger" id="sheet-del" type="button">Delete event</button>
    </div>
  `;

  const sheetIn = document.getElementById('sheet-in');

  // Field edits. `change` fires on blur for text and immediately for date,
  // time and select, so typing is never interrupted by a re-render.
  sheetIn.querySelectorAll('[data-f]').forEach((input) => {
    input.onchange = () => {
      const field = input.dataset.f;
      const value = input.value.trim() === '' ? null : input.value;
      const wasDate = e.date;
      mutate(field === 'date' ? `Moved to ${value}` : `${e.title} updated`, (s) => {
        const ev = s.events.find((x) => x.id === id);
        ev[field] = value;
        // Correcting a date is the moment the event stops being a guess.
        if (field === 'date' && value !== wasDate) ev.confidence = 'fixed';
      });
      openSheet(id, field);
    };
  });

  // Crew assignment.
  sheetIn.querySelectorAll('[data-role]').forEach((sel) => {
    sel.onchange = () => {
      const i = Number(sel.dataset.role);
      const who = sel.value || null;
      mutate(who ? `${MEMBERS[who]?.known_as ?? who} added to ${e.roles[i].label}`
                 : `${e.roles[i].label} reopened`, (s) => {
        s.events.find((x) => x.id === id).roles[i].member = who;
      });
      openSheet(id, null);
      sheetIn.querySelector(`[data-role="${i}"]`)?.focus();
    };
  });

  // --- Editing the roles themselves ---------------------------------------
  // Until this existed, an event created by hand could never be crewed: the
  // sheet said its roles had to be named and offered no way to name them.
  const roleEdit = (i, label, fn, refocus) => {
    mutate(label, (s) => fn(s.events.find((x) => x.id === id).roles[i]));
    openSheet(id, null);
    if (refocus) sheetIn.querySelector(refocus)?.focus();
  };

  sheetIn.querySelectorAll('[data-role-label]').forEach((input) => {
    input.onchange = () => {
      const i = Number(input.dataset.roleLabel);
      const label = input.value.trim().toUpperCase() || 'ROLE';
      roleEdit(i, `Renamed to ${label}`, (r) => {
        r.label = label;
        // Re-derive the skill the role needs, so a renamed role still filters
        // the crew list correctly.
        if (LABEL_ROLE[label]) r.role = LABEL_ROLE[label];
      }, `[data-role-label="${i}"]`);
    };
  });

  sheetIn.querySelectorAll('[data-role-del]').forEach((btn) => {
    btn.onclick = () => {
      const i = Number(btn.dataset.roleDel);
      const gone = e.roles[i].label;
      bayEdit = null;
      mutate(`Removed ${gone}`, (s) => { s.events.find((x) => x.id === id).roles.splice(i, 1); });
      openSheet(id, null);
    };
  });

  // Times and on-site collapse behind one line; this only toggles disclosure,
  // so it is view state and never goes through mutate().
  sheetIn.querySelectorAll('[data-role-edit]').forEach((btn) => {
    btn.onclick = () => {
      const i = Number(btn.dataset.roleEdit);
      bayEdit = bayEdit === i ? null : i;
      openSheet(id, null);
      sheetIn.querySelector(`[data-role-edit="${i}"]`)?.focus();
    };
  });

  sheetIn.querySelectorAll('[data-role-time]').forEach((input) => {
    input.onchange = () => {
      const [i, field] = input.dataset.roleTime.split(':');
      roleEdit(Number(i), `${e.roles[Number(i)].label} times updated`,
        (r) => { r[field] = input.value || null; }, `[data-role-time="${i}:${field}"]`);
    };
  });

  sheetIn.querySelectorAll('[data-role-onsite]').forEach((box) => {
    box.onchange = () => {
      const i = Number(box.dataset.roleOnsite);
      roleEdit(i, box.checked ? `${e.roles[i].label} is on site` : `${e.roles[i].label} moved off site`,
        (r) => { r.on_site = box.checked; }, `[data-role-onsite="${i}"]`);
    };
  });

  document.getElementById('role-add').onclick = () => {
    const at = e.roles.length;
    bayEdit = null;
    mutate('Role added', (s) => {
      s.events.find((x) => x.id === id).roles.push(
        { label: 'NEW ROLE', role: null, member: null, from: null, to: null, on_site: true });
    });
    openSheet(id, null);
    const input = sheetIn.querySelector(`[data-role-label="${at}"]`);
    input?.focus();
    input?.select();
  };

  document.getElementById('sheet-x').onclick = closeSheet;
  document.getElementById('sheet-done').onclick = closeSheet;
  document.getElementById('sheet-del').onclick = () => {
    closeSheet();
    mutate(`Deleted ${e.title}`, (s) => {
      s.events = s.events.filter((x) => x.id !== id);
    });
  };

  return true;
}

function closeSheet() {
  bayEdit = null;
  sheetId = null;
  document.getElementById('sheet').classList.remove('is-open');
  document.getElementById('sheet').setAttribute('aria-hidden', 'true');
  document.getElementById('scrim').classList.remove('is-open');
}

// --- Navigation -----------------------------------------------------------
const VIEWS = [
  ['overview', 'Overview', 'dashboard'],
  ['calendar', 'Calendar', 'calendar'],
  ['schedule', 'Schedule', 'timeline'],
  ['tasks',    'To do',    'checklist'],
  ['crew',     'Crew',     'group'],
];
let view = 'overview';

// Previous pill values, so a count that moved can say so. Closing a crew gap
// happens in the sheet, three hundred pixels from the number it changes.
let lastPills = {};

function renderNav() {
  const open = totalOpen();
  const overdue = withDue(DATA.tasks || []).filter((t) => !t.done && t.left !== null && t.left < 0).length;
  const next = {};
  document.getElementById('nav').innerHTML = VIEWS.map(([id, label, icon]) => {
    const pill = id === 'calendar' || id === 'schedule' ? open : id === 'tasks' ? overdue : null;
    if (pill !== null) next[id] = pill;
    const moved = pill !== null && lastPills[id] !== undefined && lastPills[id] !== pill;
    return `<button class="nav-item" data-view="${id}" aria-current="${view === id}" type="button">
      ${svg(icon, 'icon')} <span>${label}</span>
      ${pill !== null ? `<span class="nav-pill num ${pill ? '' : 'is-clear'}${moved ? ' is-hit' : ''}">${pill}</span>` : ''}
    </button>`;
  }).join('');
  lastPills = next;
}

function setView(v) {
  view = v;
  for (const [id] of VIEWS) document.getElementById(`v-${id}`).hidden = id !== v;
  renderNav();
  // Leaving for another screen closes the sheet. Otherwise the drawer sits
  // over a screen it has nothing to do with, and the scrim swallows the first
  // click you make there.
  closeSheet();
  setSide(false);
  window.scrollTo({ top: 0 });
}

// --- Wiring ---------------------------------------------------------------
document.addEventListener('click', (ev) => {
  const t = ev.target;

  const nav = t.closest('[data-view]');
  if (nav) { setView(nav.dataset.view); return; }

  const add = t.closest('[data-add]');
  if (add) { addEvent(add.dataset.add); return; }

  // "Assign" jumps to the sheet with that role's select focused, so closing a
  // gap from the schedule is one click and one choice.
  const assign = t.closest('[data-assign]');
  if (assign) {
    const [id, i] = assign.dataset.assign.split(':');
    openSheet(id, null);
    document.querySelector(`[data-role="${i}"]`)?.focus();
    return;
  }

  const evBtn = t.closest('[data-ev]');
  if (evBtn) { openSheet(evBtn.dataset.ev); return; }

  const rib = t.closest('.rib');
  if (rib) { cur = { y: +rib.dataset.y, m: +rib.dataset.m }; renderCalendar(); return; }

  const cf = t.closest('[data-cal-filter]');
  if (cf) { calFilter = cf.dataset.calFilter; renderCalendar(); return; }

  const sd = t.closest('[data-sel-day]');
  if (sd) { selDay = sd.dataset.selDay; renderSchedule(); return; }

  const wk = t.closest('[data-week]');
  if (wk) {
    const d = parse(selDay);
    selDay = iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() + Number(wk.dataset.week)));
    renderSchedule(); return;
  }

  const sm = t.closest('[data-sched]');
  if (sm) { schedMode = sm.dataset.sched; renderSchedule(); return; }

  const tm = t.closest('[data-task-mode]');
  if (tm) { taskMode = tm.dataset.taskMode; renderTasks(); return; }

  const area = t.closest('[data-area]');
  if (area) { areaFilter = area.dataset.area; renderTasks(); return; }

  const skill = t.closest('[data-skill]');
  if (skill) { skillFilter = skill.dataset.skill; renderCrew(); return; }

  if (t.closest('#hide-done')) { hideDone = !hideDone; renderTasks(); return; }
  if (t.closest('#task-new')) {
    addingTask = true; renderTasks();
    document.querySelector('#task-form [name=title]')?.focus();
    return;
  }
  if (t.closest('#task-cancel')) { addingTask = false; renderTasks(); return; }

  const tdel = t.closest('[data-task-del]');
  if (tdel) {
    const id = tdel.dataset.taskDel;
    const task = DATA.tasks.find((x) => x.id === id);
    mutate(`Deleted: ${task.title}`, (s) => { s.tasks = s.tasks.filter((x) => x.id !== id); });
    return;
  }
  if (t.closest('#prev')) { cur.m--; if (cur.m < 0) { cur.m = 11; cur.y--; } renderCalendar(); return; }
  if (t.closest('#next')) { cur.m++; if (cur.m > 11) { cur.m = 0; cur.y++; } renderCalendar(); return; }
  if (t.closest('#today')) {
    const d = parse(TODAY); cur = { y: d.getFullYear(), m: d.getMonth() }; renderCalendar(); return;
  }
});

// The sidebar and its backdrop move together, so there is no state where one
// is showing and the other is not.
function setSide(open) {
  document.getElementById('side').classList.toggle('is-open', open);
  document.getElementById('side-scrim').classList.toggle('is-open', open);
  document.getElementById('menu').setAttribute('aria-expanded', String(open));
}
document.getElementById('menu').onclick = () =>
  setSide(!document.getElementById('side').classList.contains('is-open'));
document.getElementById('side-scrim').onclick = () => setSide(false);
document.getElementById('add-event').onclick = () => addEvent(TODAY);
document.getElementById('help').onclick = () => toast(
  'Prototype: edits persist in this browser only. Export writes a corrected year.json.',
  () => {});

document.getElementById('scrim').onclick = closeSheet;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSheet(); setSide(false); }
});

// Search re-renders every list view; the calendar fades non-matches instead of
// removing them.
let qTimer;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { q = e.target.value.trim().toLowerCase(); render(); }, 120);
});

// A to-do you add is a to-do like any other: same store, same undo, and it
// leaves in the export. `source: 'you'` distinguishes it from the handover's
// own items, which carry a section reference instead.
document.addEventListener('submit', (ev) => {
  if (ev.target.id !== 'task-form') return;
  ev.preventDefault();
  const f = new FormData(ev.target);
  const title = String(f.get('title')).trim();
  if (!title) return;
  addingTask = false;
  mutate(`Added: ${title}`, (s) => {
    s.tasks.push({
      id: `you-${Date.now().toString(36)}`,
      title, detail: null, area: f.get('area'), source: 'you',
      owner_role: 'Station Manager',
      anchor: null, lead_days: null, due: f.get('due') || null, done: false,
    });
  });
});

// Ticking a box is a mutation like any other, so it is persisted and undoable
// on the same path as moving an event.
document.addEventListener('change', (ev) => {
  const box = ev.target.closest('[data-task]');
  if (!box) return;
  const id = box.dataset.task;
  const t = DATA.tasks.find((x) => x.id === id);
  mutate(box.checked ? `Done: ${t.title}` : `Reopened: ${t.title}`, (s) => {
    s.tasks.find((x) => x.id === id).done = box.checked;
  });
});

// --- Moving events across dates -------------------------------------------
// Drag is the enhancement; the date field in the sheet is the real mechanism,
// because HTML5 drag-and-drop does not exist on touch and half the use of this
// product is on a phone.
let dragId = null;

document.addEventListener('dragstart', (ev) => {
  const chip = ev.target.closest('.ev');
  if (!chip) return;
  dragId = chip.dataset.ev;
  chip.classList.add('is-dragging');
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', dragId);
});

document.addEventListener('dragend', (ev) => {
  ev.target.closest('.ev')?.classList.remove('is-dragging');
  document.querySelectorAll('.day.is-drop').forEach((d) => d.classList.remove('is-drop'));
  dragId = null;
});

document.addEventListener('dragover', (ev) => {
  const day = ev.target.closest('.day');
  if (!day || !dragId) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.day.is-drop').forEach((d) => d.classList.remove('is-drop'));
  day.classList.add('is-drop');
});

document.addEventListener('drop', (ev) => {
  const day = ev.target.closest('.day');
  if (!day || !dragId) return;
  ev.preventDefault();
  const id = dragId, to = day.dataset.day;
  const moved = DATA.events.find((x) => x.id === id);
  if (!moved || moved.date === to) return;
  const from = moved.date;
  mutate(`${moved.title}: ${from} → ${to}`, (s) => {
    const target = s.events.find((x) => x.id === id);
    target.date = to;
    // Dragging something onto a date is a decision, so it stops being inferred.
    target.confidence = 'fixed';
  });
});

// --- Adding events --------------------------------------------------------
function addEvent(date) {
  const id = `new-${Date.now().toString(36)}`;
  mutate('Event added', (s) => {
    s.events.push({
      id, title: 'New event', date, strand: 'society', status: 'idea',
      confidence: 'fixed', venue: null, roles: [],
    });
  });
  openSheet(id, 'title');
}

// --- Export ---------------------------------------------------------------
// The point of letting you correct the year is getting the corrections back.
function exportYear() {
  const out = { ...SEED, events: DATA.events, tasks: DATA.tasks,
                exported_at: new Date().toISOString() };
  const url = URL.createObjectURL(
    new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' })
  );
  const a = document.createElement('a');
  a.href = url; a.download = 'year.json'; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('export').onclick = exportYear;

document.getElementById('reset').onclick = () => {
  const before = clone(DATA);
  DATA = clone(SEED);
  persist();
  render();
  toast('Reset to the seed year', () => { DATA = before; persist(); render(); });
};

// --- Render ---------------------------------------------------------------
function render() {
  CLASHES = findClashes();
  renderNav();
  renderOverview();
  renderCalendar();
  renderSchedule();
  renderTasks();
  renderCrew();
  // The sheet is part of the render, not a thing that happens to be on top of
  // it. Without this, Undo restored the data and left the sheet showing the
  // state you had just undone — and if the undone change was a deletion, the
  // sheet stayed open over an event that no longer existed.
  if (sheetId) {
    if (!renderSheet(sheetId)) closeSheet();
  }
}

// Materialise the working copy on first load. The working copy is the truth
// (the seed is only a fallback), so it should exist from the first visit
// rather than springing into being on the first edit.
persist();
setView('overview');
render();
</script>
